name: NAR monthly historical replay
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-10-01"
      end:
        description: "End date YYYY-MM-DD"
        required: true
        default: "2026-10-31"
      confidence_cutoffs:
        description: "Optional fixed cutoffs from earlier month, e.g. 0.02511,0.05710,0.11511"
        required: false
        default: ""
      max_races:
        description: "Maximum races (1..2000)"
        required: true
        default: "1000"
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate historical replay
        run: python -m unittest discover -s tests -p 'nar_monthly_replay_test.py'
      - name: Validate ROI calculator and reject unsafe inputs
        run: python -m unittest discover -s tests -p 'nar_roi_test.py'
      - name: Validate prediction-payout reconciliation
        run: python -m unittest discover -s tests -p 'nar_roi_reconciliation_test.py'
      - name: Validate official NAR win payout extraction
        run: python -m unittest discover -s tests -p 'nar_official_win_export_test.py'
      - name: Replay NAR monthly archives
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          MAX_RACES: ${{ inputs.max_races }}
          CONFIDENCE_CUTOFFS: ${{ inputs.confidence_cutoffs }}
        run: |
          args=(--start "$START" --end "$END" --max-races "$MAX_RACES" --output nar-monthly-replay.json)
          if [ -n "$CONFIDENCE_CUTOFFS" ]; then args+=(--confidence-cutoffs "$CONFIDENCE_CUTOFFS"); fi
          python scripts/replay_nar_monthly.py "${args[@]}"
      - name: Save backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nar-monthly-replay
          path: nar-monthly-replay.json
          if-no-files-found: warn
          retention-days: 30
