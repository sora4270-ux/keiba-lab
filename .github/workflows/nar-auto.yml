name: NAR every-race forecast and verification
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_nar.py'
      - 'scripts/odds_encoding.py'
      - 'scripts/trio_strategy.py'
      - 'scripts/value_strategy_v5.py'
      - '.github/workflows/nar-auto.yml'
      - 'index.html'
      - 'tests/roi.test.cjs'
      - 'tests/race-intel.test.cjs'
      - 'tests/forecast-lock.test.cjs'
      - 'tests/view-switch.test.cjs'
      - 'tests/value_strategy_v5_test.py'
      - 'tests/odds_encoding_test.py'
      - 'race-intel.js'
  schedule:
    # Start away from the top of the hour. Each scheduled runner polls repeatedly
    # so forecasts do not need a fresh GitHub schedule event for every poll.
    - cron: '7,37 21-23,0-13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nar-forecasts
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify website JavaScript syntax and feature elements
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = html.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/keiba-lab-inline.js').write_text(js, encoding='utf-8')
          for token in ('id="nar-races"', 'function savedTrioList(', 'id="manual-trio-list"', 'id="manual-trio-count"', 'id="jra-center"', 'function jraDateTime(', 'id="jra-entries"', 'function jraAutoPredict('):
              assert token in html, f'Feature missing: {token}'
          print('All trio UI elements found')
          PY
          node --check /tmp/keiba-lab-inline.js
          node --check race-intel.js
          python -m py_compile scripts/update_nar.py scripts/odds_encoding.py scripts/value_strategy_v5.py
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const fn=html.slice(html.indexOf('function jraDateTime('),html.indexOf('function jraValidRaces('));
          assert.ok(fn.startsWith('function jraDateTime('),'JRA validator unavailable');
          const forecastOpen=(start)=>{const deadline=Date.parse(start)-15*60000;if(!Number.isFinite(deadline)||Date.now()>=deadline)throw Error('発走15分前の締切超過');};
          const jraDateTime=new Function('JRA_VENUES','assertForecastOpen',fn+';return jraDateTime;')(new Set(['東京','中山','京都','阪神','中京','新潟','福島','小倉','札幌','函館']),forecastOpen);
          const good={date:'2099-01-01',venue:'東京',race_no:11,start_at:'2099-01-01T15:40:00+09:00'};
          assert.doesNotThrow(()=>jraDateTime(good));
          for(const bad of [{...good,venue:'船橋'},{...good,start_at:'2099-01-01T15:40:00'},{...good,race_no:0},{...good,date:'2099/01/01'},{...good,start_at:'2020-01-01T15:40:00+09:00'}]){
            assert.throws(()=>jraDateTime(bad));
          }
          console.log('PASS: JRA 10 venues, ISO+JST date validation and no past forecasts');
          const dateFns=html.slice(html.indexOf('function jstRaceToday('),html.indexOf('let narViewedData='));
          assert.ok(dateFns.startsWith('function jstRaceToday('),'date filter unavailable');
          const updateRaceDateOptions=new Function('esc',dateFns+';return updateRaceDateOptions;')(x=>String(x));
          const dateSelect={value:'2026-11-02',innerHTML:''};
          assert.equal(updateRaceDateOptions(dateSelect,[{date:'2026-11-02'},{date:'2026-11-03'}]),'2026-11-02');
          assert.ok(dateSelect.innerHTML.includes('2026-11-03'));
          dateSelect.value='all';
          assert.equal(updateRaceDateOptions(dateSelect,[]),'all');
          assert.ok(html.includes('id="nar-view-date"')&&html.includes('id="jra-view-date"'));
          console.log('PASS: NAR/JRA date filters and historical date selection');
          NODE
      - name: Self-test (no external services)
        run: |
          python scripts/update_nar.py --selftest
          python -m unittest discover -s tests -p 'odds_encoding_test.py'
          python scripts/trio_strategy.py --selftest
          python -m unittest discover -s tests -p 'value_strategy_v5_test.py'
      - name: ROI and race insight regression tests
        run: |
          node tests/roi.test.cjs
          node tests/race-intel.test.cjs
          node tests/forecast-lock.test.cjs
          node tests/view-switch.test.cjs
          python scripts/trio_strategy.py --backtest
      - name: Refresh and save NAR forecasts and results
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          attempts=1
          if [[ "$EVENT_NAME" == schedule ]]; then
            attempts=12
          fi
          last_status=0
          for ((i=0; i<attempts; i++)); do
            hour=$(TZ=Asia/Tokyo date +%H)
            if [[ "$EVENT_NAME" == schedule ]] && ((10#$hour < 6 || 10#$hour >= 23)); then
              break
            fi
            started=$SECONDS
            # A queued schedule may have checked out an older data commit.
            git pull --rebase
            if python scripts/update_nar.py; then
              last_status=0
              git add data/auto/nar_predictions.json
              if ! git diff --cached --quiet; then
                git commit -m "Update NAR pre-race forecasts and confirmed hit rates"
                git pull --rebase
                git push
              fi
            else
              last_status=$?
              echo "::warning::NAR refresh failed (exit ${last_status})."
            fi
            if ((i+1 < attempts)); then
              pause=$((300 - (SECONDS - started)))
              if ((pause > 0)); then sleep "$pause"; fi
            fi
          done
          exit "$last_status"
