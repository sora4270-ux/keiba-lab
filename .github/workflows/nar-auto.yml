name: NAR every-race forecast and verification
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_nar.py'
      - '.github/workflows/nar-auto.yml'
      - 'index.html'
      - 'tests/roi.test.cjs'
  schedule:
    # UTC 00:00-13:55 = JST 09:00-22:55; GitHub may delay scheduled jobs.
    - cron: '*/5 0-13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nar-forecasts
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify website JavaScript syntax and feature elements
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = html.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/keiba-lab-inline.js').write_text(js, encoding='utf-8')
          for token in ('id="nar-races"', 'function savedTrioList(', 'id="manual-trio-list"', 'id="manual-trio-count"', 'id="jra-center"', 'function jraDateTime(', 'id="jra-entries"', 'function jraAutoPredict('):
              assert token in html, f'Feature missing: {token}'
          print('All trio UI elements found')
          PY
          node --check /tmp/keiba-lab-inline.js
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const fn=html.slice(html.indexOf('function jraDateTime('),html.indexOf('function jraValidRaces('));
          assert.ok(fn.startsWith('function jraDateTime('),'JRA validator unavailable');
          const jraDateTime=new Function('JRA_VENUES',fn+';return jraDateTime;')(new Set(['東京','中山','京都','阪神','中京','新潟','福島','小倉','札幌','函館']));
          const good={date:'2099-01-01',venue:'東京',race_no:11,start_at:'2099-01-01T15:40:00+09:00'};
          assert.doesNotThrow(()=>jraDateTime(good));
          for(const bad of [{...good,venue:'船橋'},{...good,start_at:'2099-01-01T15:40:00'},{...good,race_no:0},{...good,date:'2099/01/01'},{...good,start_at:'2020-01-01T15:40:00+09:00'}]){
            assert.throws(()=>jraDateTime(bad));
          }
          console.log('PASS: JRA 10 venues, ISO+JST date validation and no past forecasts');
          NODE
      - name: Self-test (no external services)
        run: python scripts/update_nar.py --selftest
      - name: ROI calculation regression test
        run: node tests/roi.test.cjs
      - name: Obtain NAR official day CSV and update predictions
        run: python scripts/update_nar.py
      - name: Save frozen forecasts and settled hit rates
        shell: bash
        run: |
          if ! git diff --quiet -- data/auto/nar_predictions.json || [ -n "$(git ls-files --others --exclude-standard data/auto/nar_predictions.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/auto/nar_predictions.json
            git commit -m "Update NAR pre-race forecasts and confirmed hit rates"
            git pull --rebase
            git push
          else
            echo "No new forecasts or settled results."
          fi
