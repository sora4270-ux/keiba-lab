name: NAR odds parser regression
on:
  pull_request:
    paths:
      - 'scripts/update_nar.py'
      - 'scripts/trio_strategy.py'
      - 'scripts/odds_encoding.py'
      - 'tests/odds_encoding_test.py'
      - '.github/workflows/nar-odds-ci.yml'
permissions:
  contents: read
jobs:
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test UTF-8/cp932 NAR odds parsing
        run: |
          python -m py_compile scripts/update_nar.py scripts/trio_strategy.py scripts/odds_encoding.py
          python -m unittest discover -s tests -p 'odds_encoding_test.py' -v
          python scripts/update_nar.py --selftest
          python scripts/trio_strategy.py --selftest
