name: V5 forecast strategy regression
on:
  pull_request:
    paths:
      - 'scripts/update_nar.py'
      - 'scripts/trio_strategy.py'
      - 'scripts/value_strategy_v5.py'
      - 'tests/value_strategy_v5_test.py'
      - 'tests/adaptive-trifecta.test.cjs'
      - 'tests/roi.test.cjs'
      - 'index.html'
      - '.github/workflows/value-strategy-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax and pre-race regression
        run: |
          python -m py_compile scripts/update_nar.py scripts/trio_strategy.py scripts/value_strategy_v5.py
          python -m unittest discover -s tests -p 'value_strategy_v5_test.py' -v
          python scripts/update_nar.py --selftest
          python scripts/trio_strategy.py --selftest
      - name: Frontend syntax and historical betting regression
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('index.html').read_text(encoding='utf-8')
          assert 'function v5ShadowHtml(' in page
          assert 'trio_v5' in page
          js = page.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/keiba-lab-ui.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/keiba-lab-ui.js
          node tests/adaptive-trifecta.test.cjs
          node tests/roi.test.cjs
